general {
    lock_cmd = pidof hyprlock || hyprlock       # Kilit komutu
    before_sleep_cmd = loginctl lock-session    # Uykuya geçmeden hemen önce kilitle
    after_sleep_cmd = hyprctl dispatch dpms on  # Uyanınca ekranı aç
}

listener {
    timeout = 300                                # 5 dakika boşta kalırsa
    on-timeout = loginctl lock-session           # Ekranı kilitle
}

listener {
    timeout = 330                                # 5.5 dakika boşta kalırsa
    on-timeout = hyprctl dispatch dpms off       # Ekran gücünü kes (Tasarruf)
    on-resume = hyprctl dispatch dpms on         # Geri gelince aç
}
